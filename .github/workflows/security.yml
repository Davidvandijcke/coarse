name: security

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Static secret + model-ID scan
        run: python3 scripts/security_scanner.py --strict

      - name: Audit locked Python dependencies
        run: |
          uv export --quiet --frozen --all-extras --no-dev --no-emit-project \
            --output-file "$RUNNER_TEMP/coarse-audit-requirements.txt"
          uvx pip-audit --strict --no-deps --disable-pip --desc=off \
            --progress-spinner=off \
            --requirement "$RUNNER_TEMP/coarse-audit-requirements.txt"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Audit web dependencies
        working-directory: web
        run: |
          npm ci
          npm audit --omit=dev
