name: Release

# Publishes coarse-ink to PyPI when a v* tag is pushed. Uses PyPI Trusted
# Publishing (OIDC) — no API token secret required. One-time PyPI setup:
#
#   1. Go to https://pypi.org/manage/project/coarse-ink/settings/publishing/
#   2. Add a Trusted Publisher with:
#        owner:            Davidvandijcke
#        repository:       coarse
#        workflow:         release.yml
#        environment:      pypi
#   3. Push any new v* tag. The `publish` job runs in the `pypi` GitHub
#      environment and mints a short-lived OIDC token that PyPI accepts.
#
# Until the pending publisher is registered, the first `publish` job run
# will fail with "invalid-publisher" — that's expected. Register on PyPI,
# then re-run the failed workflow (or push a new tag).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # tests/test_pipeline_spec.py shells out to
      # `node --experimental-strip-types` to run `web/src/lib/estimateCost.ts`
      # directly for the Python↔TS cost-gate parity check. The
      # `--experimental-strip-types` requires Node 22.6+. Pin Node 24 to
      # match Vercel production and keep this release workflow in lockstep
      # with ci.yml. The v1.3.0 release hit the missing-runtime gap on its
      # first tag push and had to be re-tagged after patching it.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          OPENROUTER_API_KEY: ""
          GOOGLE_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          INIT_VERSION=$(grep '__version__' src/coarse/__init__.py | sed 's/.*"\(.*\)".*/\1/')
          echo "tag:            $TAG"
          echo "pyproject.toml: $VERSION"
          echo "__init__.py:    $INIT_VERSION"
          if [ "$TAG" != "$VERSION" ] || [ "$TAG" != "$INIT_VERSION" ]; then
            echo "ERROR: tag / pyproject / __init__ version mismatch"
            exit 1
          fi

      - name: Build distribution
        run: uv build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The `pypi` environment scopes the OIDC trust boundary to this job.
    # Set this up on PyPI's Trusted Publishers page, not in the GitHub UI.
    environment:
      name: pypi
      url: https://pypi.org/p/coarse-ink
    permissions:
      # id-token: write is required for PyPI Trusted Publishing (OIDC).
      # No API token secret is needed.
      id-token: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
