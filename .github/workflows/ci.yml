name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true

      - name: Set up Python
        run: uv python install 3.12

      # tests/test_pipeline_spec.py shells out to
      # `node --experimental-strip-types` to run `web/src/lib/estimateCost.ts`
      # directly for the Python↔TS cost-gate parity check. The
      # `--experimental-strip-types` requires Node 22.6+. Pin Node 24 to
      # match the Vercel production runtime and keep the Python↔TS parity
      # test independent of runner-image defaults.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint (advisory)
        run: uv run ruff check src/ tests/
        continue-on-error: true

      - name: Run tests
        run: uv run pytest tests/ -v
        env:
          OPENROUTER_API_KEY: ""
          GOOGLE_API_KEY: ""
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""

      - name: Resolve optional docling stack
        run: |
          uv sync --extra dev --extra docling --locked
          uv run python - <<'PY'
          import instructor
          import transformers
          print("instructor", instructor.__version__)
          print("transformers", transformers.__version__)
          PY

      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm test
          npm run build

  version-check:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version consistency
        run: |
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          INIT_VERSION=$(grep '__version__' src/coarse/__init__.py | sed 's/.*"\(.*\)".*/\1/')
          echo "pyproject.toml: $PYPROJECT_VERSION"
          echo "__init__.py:    $INIT_VERSION"
          if [ "$PYPROJECT_VERSION" != "$INIT_VERSION" ]; then
            echo "ERROR: Version mismatch!"
            exit 1
          fi
